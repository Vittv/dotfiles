# ╔══════════════════════════════════╗
# ║      𝔼𝕟𝕧𝕚𝕣𝕠𝕟𝕞𝕖𝕟𝕥 𝕍𝕒𝕣𝕚𝕒𝕓𝕝𝕖𝕤       ║
# ╚══════════════════════════════════╝

# Cursor
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,26

cursor {
  no_hardware_cursors = false
}

# Qt and GTK apps
env = GDK_BACKEND,wayland,x11,*
env = XDG_DATA_DIRS,/var/lib/flatpak/exports/share:/home/vitt/.local/share/flatpak/exports/share:/usr/local/share:/usr/share

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT6CT_PLATFORM_THEME,qt6ct

# Default wayland for electron apps
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Default screenshot location
env = XDG_SCREENSHOTS_DIR,$HOME/Pictures/pictures/Screenshots
