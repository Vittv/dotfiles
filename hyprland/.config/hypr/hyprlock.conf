source = $HOME/.config/colors/schemes/vague/colors.conf

$accent = $flamingo
$accentAlpha = $pinkAlpha
$font = SF Pro Display

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = ~/Pictures/pictures/pics/hyprland/hyprpaper/thumb-1920-787745.png
    blur_passes = 3
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 160
    font_family = SF Pro Display Thin
    position = 0, 250
    halign = center
    valign = center
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 14
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

# USER AVATAR
