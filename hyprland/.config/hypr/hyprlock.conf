source = $HOME/.config/hypr/mocha.conf

$accent = $flamingo
$accentAlpha = $pinkAlpha
$font = SF Pro Display

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = ~/Pictures/pictures/pics/hyprland/hyprpaper/wallhaven-l8mxeq_1920x1080.png
    blur_passes = 3
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 160
    font_family = SF Pro Display Thin
    position = 0, 250
    halign = center
    valign = center
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 16
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

# USER AVATAR
# image {
#     monitor = 
#     path = ~/Pictures/pictures/pics/hyprland/hyprpaper/wallhaven-l8mxeq_1920x1080.png
#     size = 100
#     border_color = $accent
#
#     position = 0, 75
#     halign = center
#     valign = center
# }

# INPUT FIELD
input-field {
    monitor =
    size = 240, 50
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -35
    halign = center
    valign = center
}
