run ~/.tmux/plugins/tpm/tpm

# sesh
# open sesh picker with prefix + T
# bind-key t run-shell "sesh connect \"$(
#   sesh list --icons | fzf-tmux -p 80%,70% \
#     --no-sort --ansi --border-label ' sesh ' \
#     --prompt ' ' \
#     --header '  ^a all ^t tmux ^z zoxide' \
#     --bind 'tab:down,btab:up' \
#     --bind 'ctrl-a:change-prompt( )+reload(sesh list --icons)' \
#     --bind 'ctrl-t:change-prompt( )+reload(sesh list -t --icons)' \
#     --bind 'ctrl-z:change-prompt( )+reload(sesh list -z --icons)' \
# )\""
bind-key t display-popup -h 90% -w 50% -E "sesh picker -i"

# two quality of life settings that pair well with sesh
set -g detach-on-destroy off  # don't exit tmux when killing a session, jump to the previous one
bind-key x kill-pane           # skip the "kill-pane? (y/n)" confirmation

# status bar
set -g status on
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=white"

# left: prefix indicator - lights up when prefix is active
set -g status-left "#{?client_prefix,#[bg=brightwhite fg=black bold]  tmux  ,#[fg=brightwhite bg=default]  tmux  }"
set -g status-left-length 20

# right: hostname
set -g status-right "#[fg=brightwhite bg=default] #H #[fg=white]"
set -g status-right-length 30

# window list styling
set -g window-status-separator ""
set -g window-status-format "#[fg=brightwhite,bg=default] #I:#W "
set -g window-status-current-format "#[fg=black,bg=brightwhite] #I:#W "
