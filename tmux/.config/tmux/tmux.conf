# Vague Color Palette
color_base="#141415"
color_surface0="#252530"
color_surface1="#333738"
color_overlay0="#252530"
color_overlay1="#606079"
color_text="#f0f0f0"
color_rosewater="#efefdc"
color_flamingo="#f7d498"
color_blue="#7e98e8"
color_mauve="#b0a0d0"
color_sapphire="#6e94b2"
color_lavender="#aeaed1"
color_pink="#bb9dbd"
color_peach="#e0a363"
color_green="#7fa563"

# Renumber windows when one is closed
set -g renumber-windows on
# status bar colors
set -g status-style "bg=$color_base,fg=$color_text"
# window status colors (just text color, no background)
set -g window-status-style "fg=$color_overlay1,bg=$color_base"
set -g window-status-current-style "fg=$color_pink,bg=$color_base,bold"
# pane border colors
set -g pane-border-style "fg=$color_surface0"
set -g pane-active-border-style "fg=$color_pink"
# message colors (when you use prefix + :)
set -g message-style "bg=$color_surface0,fg=$color_text"
set -g message-command-style "bg=$color_surface0,fg=$color_text"
# pane number display colors
set -g display-panes-active-colour "$color_pink"
set -g display-panes-colour "$color_overlay0"
# clock mode color
set -g clock-mode-colour "$color_rosewater"
# status bar position
set -g status-position bottom
# status bar refresh interval
set -g status-interval 5
# left status bar (empty - only show tabs)
set -g status-left-length 0
set -g status-left ""
# right status bar (date and time)
set -g status-right-length 100
set -g status-right "#[fg=$color_lavender] %m/%d #[fg=$color_overlay0]│ #[fg=$color_rosewater]󰥔 %-I:%M %p "
# window status format (simple text, no backgrounds)
set -g window-status-format "#I:#W "
set -g window-status-current-format "#[fg=$color_pink]󱌃 #I:#W "
# window list alignment
set -g status-justify left
# window separator
set -g window-status-separator ""
