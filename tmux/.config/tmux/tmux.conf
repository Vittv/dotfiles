# reload config with prefix + r
unbind r
unbind t

bind r source-file ~/.config/tmux/tmux.conf
# change prefix to Ctrl+Space
set -g prefix C-Space
# enable mouse support
set -g mouse on
set -s set-clipboard on
# start window numbering at 1
set -g base-index 1
# remove delay on esc in nvim
set -sg escape-time 0
set -g status-position top
# remove panel kill confirmation
bind-key x kill-pane
# vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# yazi recommended config for tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# pane border
set -g pane-border-lines single 
set -g pane-border-style "fg=#252530,bg=default"
set -g pane-active-border-style "fg=#606079,bg=default"

# renumber windows when one is closed
set -g renumber-windows on

# auto-yank mouse selections directly to system clipboard via OSC 52
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# use vim shortcuts in copy mode
setw -g mode-keys vi

# custom copy mode bindings
bind-key y copy-mode                          # prefix + y enters copy mode
bind-key p paste-buffer -p                    # prefix + p pastes from tmux buffer

# shortcuts inside copy mode (vim style)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

