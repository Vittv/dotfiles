# Renumber windows when one is closed
set -g renumber-windows on
# status bar colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
# window status colors (just text color, no background)
set -g window-status-style "fg=#6c7086,bg=#1e1e2e"
set -g window-status-current-style "fg=#f5c2e7,bg=#1e1e2e,bold"
# pane border colors
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#f5c2e7"
# message colors (when you use prefix + :)
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
# pane number display colors
set -g display-panes-active-colour "#f5c2e7"
set -g display-panes-colour "#6c7086"
# clock mode color
set -g clock-mode-colour "#f2cdcd"
# status bar position
set -g status-position bottom
# status bar refresh interval
set -g status-interval 5
# left status bar (empty - only show tabs)
set -g status-left-length 0
set -g status-left ""
# right status bar (date and time)
set -g status-right-length 100
set -g status-right "#[fg=#b4befe] %m/%d #[fg=#6c7086]│ #[fg=#f2cdcd]󰥔 %-I:%M %p "
# window status format (simple text, no backgrounds)
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#f5c2e7]  #I:#W "
# window list alignment
set -g status-justify left
# window separator
set -g window-status-separator ""
