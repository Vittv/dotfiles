# reload config with prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# change prefix to Ctrl+s
set -g prefix C-s

# enable mouse support
set -g mouse on

# start window numbering at 1
set -g base-index 1

# remove panel kill confirmation
bind-key x kill-pane

# vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Vague theme
# status bar colors
set -g status-style "bg=#1c1c24,fg=#cdcdcd"

# window status colors
set -g window-status-style "fg=#606079,bg=#1c1c24"
set -g window-status-current-style "fg=#7e98e8,bg=#252530,bold"

# pane border colors
set -g pane-border-style "fg=#252530"
set -g pane-active-border-style "fg=#6e94b2"

# message colors (when you use prefix + :)
set -g message-style "bg=#252530,fg=#cdcdcd"
set -g message-command-style "bg=#252530,fg=#cdcdcd"

# pane number display colors
set -g display-panes-active-colour "#7e98e8"
set -g display-panes-colour "#606079"

# clock mode color
set -g clock-mode-colour "#6e94b2"

# status bar position
set -g status-position bottom

# status bar refresh interval
set -g status-interval 5

# left status bar (empty - only show tabs)
set -g status-left-length 0
set -g status-left ""

# right status bar (date and time)
set -g status-right-length 100
set -g status-right "#[fg=#252530,bg=#1c1c24]#[fg=#cdcdcd,bg=#252530] %Y-%m-%d #[fg=#606079]│#[fg=#cdcdcd] %H:%M "

# window status format
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# window list alignment
set -g status-justify left
