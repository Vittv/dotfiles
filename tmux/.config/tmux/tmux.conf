# reload config with prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# change prefix to Ctrl+Space
set -g prefix C-Space

# enable mouse support
set -g mouse on
set -s set-clipboard on

# start window numbering at 1
set -g base-index 1

# remove delay on esc in nvim
set -sg escape-time 0

# remove panel kill confirmation
bind-key x kill-pane

# vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"


# yazi recommended config for tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Catppuccin Mocha Color Palette
mocha_base="#1e1e2e"
mocha_surface0="#313244"
mocha_surface1="#45475a"
mocha_overlay0="#6c7086"
mocha_overlay1="#7f849c"
mocha_text="#cdd6f4"
mocha_rosewater="#f5e0dc"
mocha_flamingo="#f2cdcd"
mocha_blue="#89b4fa"
mocha_mauve="#cba6f7"
mocha_sapphire="#74c7ec"
mocha_lavender="#b4befe"
mocha_pink="#f5c2e7"
mocha_peach="#fab387"
mocha_green="#a6e3a1"

# Vague Color Palette
vague_base="#141415"
vague_surface0="#252530"
vague_surface1="#333738"
vague_overlay0="#252530"
vague_overlay1="#606079"
vague_text="#f0f0f0"
vague_rosewater="#efefdc"
vague_flamingo="#f7d498"
vague_blue="#7e98e8"
vague_mauve="#b0a0d0"
vague_sapphire="#6e94b2"
vague_lavender="#aeaed1"
vague_pink="#bb9dbd"
vague_peach="#e0a363"
vague_green="#7fa563"

# Renumber windows when one is closed
set -g renumber-windows on
# status bar colors
set -g status-style "bg=$vague_base,fg=$vague_text"
# window status colors (just text color, no background)
set -g window-status-style "fg=$vague_overlay1,bg=$vague_base"
set -g window-status-current-style "fg=$vague_pink,bg=$vague_base,bold"
# pane border colors
set -g pane-border-style "fg=$vague_surface0"
set -g pane-active-border-style "fg=$vague_pink"
# message colors (when you use prefix + :)
set -g message-style "bg=$vague_surface0,fg=$vague_text"
set -g message-command-style "bg=$vague_surface0,fg=$vague_text"
# pane number display colors
set -g display-panes-active-colour "$vague_pink"
set -g display-panes-colour "$vague_overlay0"
# clock mode color
set -g clock-mode-colour "$vague_rosewater"
# status bar position
set -g status-position bottom
# status bar refresh interval
set -g status-interval 5
# left status bar (empty - only show tabs)
set -g status-left-length 0
set -g status-left ""
# right status bar (date and time)
set -g status-right-length 100
set -g status-right "#[fg=$vague_lavender] %m/%d #[fg=$vague_overlay0]│ #[fg=$vague_rosewater]󰥔 %-I:%M %p "
# window status format (simple text, no backgrounds)
set -g window-status-format "#I:#W "
set -g window-status-current-format "#[fg=$vague_pink]󱌃 #I:#W "
# window list alignment
set -g status-justify left
# window separator
set -g window-status-separator ""
