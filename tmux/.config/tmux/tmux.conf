# reload config with prefix + r
unbind r
unbind t

bind r source-file ~/.config/tmux/tmux.conf
# change prefix to Ctrl+Space
set -g prefix C-Space
# enable mouse support
set -g mouse on
set -s set-clipboard on
# start window numbering at 1
set -g base-index 1
# remove delay on esc in nvim
set -sg escape-time 0
# remove panel kill confirmation
bind-key x kill-pane
# vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# yazi recommended config for tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# renumber windows when one is closed
set -g renumber-windows on

# plugins
set -g @plugin 'niksingh710/minimal-tmux-status'

set -g @minimal-tmux-fg "#000000"
set -g @minimal-tmux-bg "white"
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""
set -g @minimal-tmux-justify "absolute-centre"
set -g @minimal-tmux-status-right "#H  "

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run ~/.tmux/plugins/tpm/tpm

# sesh
# open sesh picker with prefix + T
bind-key t run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' \
    --prompt ' ' \
    --header '  ^a all ^t tmux ^z zoxide' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt( )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt( )+reload(sesh list -t --icons)' \
    --bind 'ctrl-z:change-prompt( )+reload(sesh list -z --icons)' \
)\""

# two quality of life settings that pair well with sesh
set -g detach-on-destroy off  # don't exit tmux when killing a session, jump to the previous one
bind-key x kill-pane           # skip the "kill-pane? (y/n)" confirmation

