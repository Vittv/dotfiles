# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
include ./themes/vague.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
# font_family      family="M+1Code Nerd Font Mono"
# font_family      family="D2CodingLigature Nerd Font Mono"
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
# END_KITTY_FONTS

# BEGIN_BACKGROUND_SETTINGS
# background_opacity 0.95
background_opacity 1
background_blur 0 
# END_BACKGROUND_SETTINGS

window_padding_width 4.6
scrollback_indicator_opacity 0

# Cursor animation
# cursor_trail 3
# cursor_trail_decay 0.01 0.5
# cursor_trail_start_threshold 0

line_breaks word

# Switching tabs through indexing
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
