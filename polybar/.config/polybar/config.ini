[colors]
background = #171719
foreground = #cdcdcd
secondary  = #606079
black = #141415
shadow = #1c1c24
graphite = #252530
onyx = #333738
muted = #606079
gray = #878787
white = #cdcdcd
yellow = #f3be7c
amber = #e8b589
gold = #e0a363
peach = #c48282
red = #d8647e
storm = #405065
lilac = #c3c3d5
cyan = #aeaed1
magenta = #bb9dbd
aqua = #b4d4cf
lavender = #90a0b5
teal = #9bb4bc
blue = #6e94b2
iris = #7e98e8
green = #7fa563

[bar/main]
width = 100%
height = 24
radius = 0
border-size = 0
monitor = DP-0
background = ${colors.background}
foreground = ${colors.foreground}
module-margin = 0
wm-restack = bspwm
override-redirect = true
bottom = false
# font-N are referenced elsewhere via a 1-BASED index:
# font-0 -> index 1, font-1 -> index 2, font-2 -> index 3
font-0 = SF Pro Display:style=SemiBold:size=10;2
font-1 = FiraCode Nerd Font Propo:style=Bold:size=10;2
font-2 = FiraCode Nerd Font Propo:style=SemiBold:size=9;2
font-3 = SF Compact Display:style=Bold:size=10;2
font-4 = SF Compact Display:style=Bold:size=9;2
modules-left = xworkspaces spotify
modules-center = date
modules-right = systray separator mudfish bluetooth network volume ram
enable-ipc = true
cursor-click = pointer
tray-position = right

[module/mic]
type = custom/script
exec = ~/.config/polybar/src/mic.sh
tail = true
interval = -1 # Decoupled from time-based loops; only updates when told
format-padding = 3
format-foreground = ${colors.foreground}
label-font = 3
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle && polybar-msg action #mic.hook.0

[module/date]
type = internal/date
interval = 1
date = %d
time = %I:%M %p
format = <label>
format-foreground = ${colors.foreground}
label = %date%  •  %time%
format-font = 1

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
format-font = 2
format-margin = 2
label-active = %name%
label-active-foreground = ${colors.white}
label-active-underline = ${colors.white}
label-active-underline-size = 2
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.lavender}
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.yellow}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/spotify]
type = custom/script
exec = ~/.local/bin/spotify.sh
exec-if = playerctl -p spotify status &>/dev/null
interval = 1
label-font = 4
format-margin = 2
format-foreground = ${colors.cyan}
click-left = playerctl -p spotify next
click-right = playerctl -p spotify previous
click-middle = playerctl -p spotify play-pause
scroll-up = playerctl -p spotify volume 0.05+
scroll-down = playerctl -p spotify volume 0.05-
label-focused-click-left = wmctrl -s %index%
label-visible-click-left = wmctrl -s %index%

[module/systray]
type = internal/tray
tray-spacing = 4pt
tray-background = ${colors.background}
format-margin = 2

[module/temps]
type = custom/script
exec = ~/.config/polybar/src/temps.sh
interval = 5
cursor = true
label-font = 2
format-margin = 1
on-click = kitty btop

[module/separator]
type = custom/text
label = |
label-font = 3
format-foreground = ${colors.secondary}
format-margin = 2

[module/volume]
type = internal/pulseaudio
format-volume = vol <label-volume>
format-volume-foreground = ${colors.lilac}
format-volume-font = 3
format-volume-margin = 2
format-muted = <label-muted>
format-muted-foreground = ${colors.lilac}
format-muted-font = 3
format-muted-margin = 2
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted = muted
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol

[module/network]
type = internal/network
interface = enp4s0
interval = 3
format-connected-font = 3
format-connected = eth
format-connected-foreground = ${colors.blue}
format-connected-margin = 2
format-disconnected-font = 3
format-disconnected = disconnected
format-disconnected-margin = 2
format-disconnected-foreground = ${colors.red}
click-left = nm-connection-editor &

[module/bluetooth]
type = custom/text
label = bt
label-font = 3
format-foreground = ${colors.iris}
click-left = blueman-manager &
format-margin = 2


[module/mudfish]
type = custom/script
exec = ~/.local/bin/polymud-status.sh
tail = true
interval = 5
click-left = ~/.local/bin/mudfish-start.sh
click-right = ~/.local/bin/mudfish-stop.sh
format-prefix = ""
format-margin = 2
format-foreground = ${colors.cyan}
label-font = 3

[module/ram]
type = internal/memory
interval = 3
format-foreground = ${colors.lavender}
format-font = 3
format-margin = 2
label = %gb_used% / %gb_total%

[bar/main-secondary]
inherit = bar/main
monitor = HDMI-0
