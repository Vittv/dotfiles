[colors]
background = #171719
foreground = #cdcdcd
secondary  = #606079
black = #141415
shadow = #1c1c24
graphite = #252530
onyx = #333738
muted = #606079
gray = #878787
white = #cdcdcd
yellow = #f3be7c
amber = #e8b589
gold = #e0a363
maroon = #c48482
red = #d8647e
storm = #405065
lilac = #c3c3d5
cyan = #aeaed1
magenta = #bb9dbd
aqua = #b4d4cf
lavender = #90a0b5
teal = #9bb4bc
blue = #6e94b2
iris = #7e98e8
green = #7fa563
mauve = #ab9bc9
azure = #8fa3e0

[bar/main]
width = 100%
height = 24
radius = 0
border-size = 0
monitor = DP-0
background = ${colors.background}
foreground = ${colors.foreground}
module-margin = 0
wm-restack = dwm
override-redirect = false
bottom = false
# font-N are referenced elsewhere via a 1-BASED index:
# font-0 -> index 1, font-1 -> index 2, font-2 -> index 3
font-0 = SF Pro Display:style=SemiBold:size=10;2
font-1 = FiraCode Nerd Font Propo:style=Bold:size=10;2
font-2 = FiraCode Nerd Font Propo:style=Bold:size=9;2
font-3 = SF Compact Display:style=Bold:size=10;2
font-4 = SF Compact Display:style=Bold:size=9;2
font-5 = JetBrainsMono Nerd Font Propo:style=Bold:size=9;2
font-6 = SF Pro Display:style=SemiBold:size=11;2
# fontconfig stores the hyphen in Phosphor-Bold escaped, so pango needs it too
font-7 = Phosphor\\-Bold:style=Regular:size=10;2
modules-left = xworkspaces mic mic-muted tmux devserver
modules-center = date
modules-right = media-animation media-now-playing systray mudfish-on mudfish-off bluetooth network volume power
enable-ipc = true
cursor-click = pointer

[module/mic]
type = custom/script
exec = ~/.config/polybar/src/mic active
tail = true
interval = -1 ;# no polling, src/mic follows pulseaudio events itself
format-foreground = ${colors.foreground}
format-font = 8
format-margin = 2
tooltip-1 = Microphone: Active
click-left = ~/.config/polybar/src/mic toggle

[module/mic-muted]
type = custom/script
exec = ~/.config/polybar/src/mic muted
tail = true
interval = -1 ;# no polling, src/mic follows pulseaudio events itself
format-foreground = ${colors.maroon}
format-font = 8
format-margin = 2
tooltip-1 = Microphone: Muted
click-left = ~/.config/polybar/src/mic toggle

[module/date]
type = internal/date
interval = 1
date = %d
time = %I:%M %p
format = <label>
format-foreground = ${colors.foreground}
label = %date% • %time%
format-font = 1

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
format-font = 2
format-margin = 0
label-active = %name%
label-active-foreground = ${colors.white}
label-active-underline = ${colors.white}
label-active-underline-size = 2
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.lavender}
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.yellow}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-occupied-underline = ${colors.lavender}
label-occupied-underline-size = 2
label-empty-underline = ${colors.muted}
label-empty-underline-size = 2
label-urgent-underline = ${colors.yellow}
label-urgent-underline-size = 2
border-size = 1px
border-color = ${colors.yellow}

; play state marker: equalizer blocks while playing, pause block while paused
[module/media-animation]
type = custom/script
exec = ~/.config/polybar/src/media-animation
tail = true
interval = -1
format-foreground = ${colors.mauve}
format-font = 2
format-margin = 2

; plain track title, reprinted whenever the track changes
[module/media-now-playing]
type = custom/script
exec = ~/.config/polybar/src/media-now-playing
tail = true
interval = -1
format-foreground = ${colors.foreground}
format-font = 5
format-margin = 2
click-left = playerctl previous
click-middle = playerctl play-pause
click-right = playerctl next
scroll-up = playerctl volume 0.05+
scroll-down = playerctl volume 0.05-

[module/systray]
type = internal/tray
tray-spacing = 6pt
tray-background = ${colors.background}
format-margin = 2

[module/temps]
type = custom/script
exec = ~/.config/polybar/src/temps.sh
interval = 5
cursor = true
label-font = 2
format-margin = 1
on-click = kitty btop

[module/volume]
type = internal/pulseaudio
format-volume = 
format-volume-foreground = ${colors.foreground}
format-volume-font = 8
format-volume-margin = 2
format-muted = 
format-muted-foreground = ${colors.foreground}
format-muted-font = 8
format-muted-margin = 2
use-ui-max = false
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol

[module/network]
type = internal/network
interface = enp4s0
interval = 3
format-wifi = 
format-ethernet = 
format-linked = 
format-connected = 
format-connected-foreground = ${colors.foreground}
format-connected-font = 8
format-connected-margin = 2
format-disconnected = 
format-disconnected-foreground = ${colors.foreground}
format-disconnected-font = 8
format-disconnected-margin = 2
click-left = nm-connection-editor &

[module/bluetooth]
type = custom/text
label = 
label-font = 8
format-foreground = ${colors.foreground}
format-margin = 2
click-left = blueman-manager &

[module/mudfish-on]
type = custom/script
exec = ~/.config/polybar/src/mudfish on
interval = 2
format-foreground = ${colors.azure}
format-font = 8
format-margin = 2
click-left = setsid -f ~/.local/bin/mudfish-start.sh
click-right = setsid -f sudo ~/.local/bin/mudfish-stop.sh

[module/mudfish-off]
type = custom/script
exec = ~/.config/polybar/src/mudfish off
interval = 2
format-foreground = ${colors.foreground}
format-font = 8
format-margin = 2
click-left = setsid -f ~/.local/bin/mudfish-start.sh
click-right = setsid -f sudo ~/.local/bin/mudfish-stop.sh

[module/power]
type = custom/text
label = 
label-font = 8
format-foreground = ${colors.foreground}
format-margin = 2
click-left = ~/.local/bin/powermenu.sh

[module/tmux]
type = custom/script
exec = ~/.config/polybar/src/tmux
exec-if = tmux list-sessions 2>/dev/null
interval = 2
format-foreground = ${colors.foreground}
format-font = 7
click-left = kitty fish -c t

[module/devserver]
type = custom/script
exec = ~/.config/polybar/src/devserver
exec-if = ss -tlnp 2>/dev/null | grep -qE ':(5173|4173|8080|3000|8081) '
interval = 3
format-foreground = ${colors.iris}
format-font = 1
format-margin = 2
click-left = bash -c 'port=$(ss -tlnp 2>/dev/null | grep -oP ":(5173|4173|8080|3000|8081) " | head -1 | tr -d ": "); [ -n "$port" ] && xdg-open "http://localhost:$port"'

[bar/main-secondary]
inherit = bar/main
monitor = HDMI-0
