[colors]
background = #171719
foreground = #cdcdcd
secondary  = #606079
black = #141415
shadow = #1c1c24
graphite = #252530
onyx = #333738
muted = #606079
gray = #878787
white = #cdcdcd
yellow = #f3be7c
amber = #e8b589
gold = #e0a363
peach = #c48282
red = #d8647e
storm = #405065
lilac = #c3c3d5
cyan = #aeaed1
magenta = #bb9dbd
aqua = #b4d4cf
lavender = #90a0b5
teal = #9bb4bc
blue = #6e94b2
iris = #7e98e8
green = #7fa563

[bar/main]
width = 100%
height = 24
radius = 0
border-size = 0
monitor = DP-0
background = ${colors.background}
foreground = ${colors.foreground}
# CHANGED = Removed module-margin to prevent gaps between modules.
# We will add spacing to individual modules manually if needed.
module-margin = 0
# font-N are referenced elsewhere via a 1-BASED index:
#   font-0 -> index 1, font-1 -> index 2, font-2 -> index 3
font-0 = SF Compact Display:style=SemiBold:size=11;2
font-1 = FiraCode Nerd Font Propo:style=Bold:size=10;2
font-2 = FiraCode Nerd Font Propo:style=SemiBold:size=8;2
modules-left = mic xworkspaces
modules-center = date
modules-right = systray mudfish network volume powermenu
enable-ipc = true
cursor-click = pointer

[module/date]
type = internal/date
interval = 1
date = %d
time = %I:%M %p
format = <label>
format-foreground = ${colors.foreground}
label = %date%  •  %time%

[module/xworkspaces]
type = internal/xworkspaces
format-font = 2
# --- Focused Workspace ---
label-active = %name%
label-active-foreground = ${colors.white}
; label-active-background = ${colors.white}
label-active-padding = 1
# --- Persistent Empty Workspaces ---
label-empty = %name%
label-empty-foreground = ${colors.muted}
; label-empty-background = ${colors.background}
label-empty-padding = 1
# --- Unfocused but Occupied Workspaces (Has windows) ---
label-occupied = %name%
label-occupied-foreground = ${colors.muted}
; label-occupied-background = ${colors.graphite}
label-occupied-padding = 1
# --- Urgent Workspace ---
label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/systray]
type = internal/tray
# Added margin back here locally since we disabled bar module-margin
format-margin = 4
tray-spacing = 4pt
tray-background = ${colors.background}

[module/volume]
type = internal/pulseaudio
# The icon lives inside the <ramp-volume> tag, so it needs its own font
# property - generic format-font does not reach into tags.
format-volume-font = 3
# Added margin here to separate it from other right-side modules
format-margin = 2
format-volume = <ramp-volume>
format-volume-foreground = ${colors.yellow}
label-muted = 
label-muted-foreground = ${colors.yellow}
label-muted-font = 3
ramp-volume-0 = 
ramp-volume-1 =  
ramp-volume-2 =  
click-right = pavucontrol

[module/network]
type = internal/network
interface = enp4s0
interval = 3
# format-connected/disconnected are literal text, not a tag, so they
# take their own -font suffix directly.
format-connected-font = 3
format-connected = 
format-connected-foreground = ${colors.green}
format-connected-margin = 4
format-disconnected-font = 3
format-disconnected = 󰈂
format-disconnected-foreground = ${colors.red}
format-disconnected-margin = 4

[module/mic]
type = custom/script
exec = ~/.config/polybar/src/mic.sh
tail = true
interval = -1 # Decoupled from time-based loops; only updates when told
format-padding = 3
format-foreground = ${colors.blue}
# custom/script's format is just <label>, so the font goes on the label,
# not on format itself.
label-font = 3
# This command allows you to toggle it by clicking the module directly on the bar
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle && polybar-msg action #mic.hook.0

[module/powermenu]
type = custom/script
exec = echo "⏻"
label-foreground = ${colors.red}
label-font = 3
click-left = ~/.local/bin/powermenu.sh
format-padding = 4

[module/mudfish]
type = custom/script
exec = ~/.local/bin/polymud-status.sh
tail = true
interval = 5
click-left = ~/.local/bin/mudfish-start.sh
click-right = ~/.local/bin/mudfish-stop.sh
format-prefix = ""
format-margin = 0
label-font = 3

[bar/main-secondary]
inherit = bar/main
monitor = HDMI-0
